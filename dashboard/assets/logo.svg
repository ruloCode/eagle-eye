<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Eagle Eye">
  <!-- Eagle Eye: un ojo cuyo iris es el diafragma de una cámara, dentro del visor. Dueña: Daniela. -->
  <!-- Esquinas del visor (azul) -->
  <g stroke="#2F7BFF" stroke-width="4" stroke-linecap="square">
    <path d="M4 16V4h12" />
    <path d="M48 4h12v12" />
    <path d="M60 48v12H48" />
    <path d="M16 60H4V48" />
  </g>
  <!-- Ojo (amarillo) -->
  <path d="M8 32C15 21 23 16 32 16s17 5 24 16c-7 11-15 16-24 16S15 43 8 32Z"
        stroke="#FFE600" stroke-width="4" stroke-linejoin="round" />
  <!-- Iris = lente -->
  <circle cx="32" cy="32" r="11" fill="#FFE600" />
  <!-- Diafragma: pupila hexagonal + 6 aspas -->
  <g stroke="#07090C" stroke-width="1.8" stroke-linecap="round">
    <path d="M36.5 32 34.25 35.9 29.75 35.9 27.5 32 29.75 28.1 34.25 28.1Z" fill="#07090C" />
    <path d="M36.5 32 40.4 38.5" />
    <path d="M34.25 35.9 26.6 41" />
    <path d="M29.75 35.9 21.3 33.5" />
    <path d="M27.5 32 23.6 25.5" />
    <path d="M29.75 28.1 37.4 23" />
    <path d="M34.25 28.1 42.7 30.5" />
  </g>
  <!-- Brillo de lente (azul) -->
  <circle cx="36.8" cy="26.6" r="1.8" fill="#2F7BFF" />
</svg>

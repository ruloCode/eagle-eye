<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eagle Eye</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ffc800'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial Black,sans-serif' font-weight='900' font-size='30' fill='%23000'%3EEE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <!--
    Dueña: Daniela. Change de OpenSpec: add-live-dashboard (capacidad `dashboard-vivo`).
    Una sola página 16:9, tema oscuro, sin scroll. Sin build, sin npm.
    Paleta: SOLO negro, amarillo y azul (blanco solo para texto).
    Servir desde la raíz del repo:  scripts/dev.sh --solo-web
      → http://localhost:5500/dashboard/?mock=1
  -->
</head>
<body>
  <main class="app">

    <!-- (1) HEADER ===========================================================
         Logo de texto "EAGLE EYE" · estado del stream · modo detectado.
    ===================================================================== -->
    <header class="nav" id="header">
      <div class="logo" aria-label="Eagle Eye"><span class="black">EAGLE</span><span class="black bloque">EYE</span></div>
      <nav class="pills">
        <span class="pill" id="pill-stream"><span class="punto"></span><span id="txt-stream">Conectando</span></span>
        <span class="pill"><span class="regular">Modo</span><span class="black" id="txt-modo">—</span></span>
      </nav>
      <span class="pill pill-amarilla" id="pill-mock" hidden>Datos de prueba</span>
    </header>

    <!-- (2) FRAME ACTUAL (hero) ==============================================
         Frame real del dron a pantalla grande; sin frame se ve el ojo de águila (assets/aguila.jpg).
         Encima: titular, visor sobre el ojo y las tarjetas de vidrio.
         TODO(daniela): overlays sin señal / analizando / presupuesto agotado (Hito 2).
    ===================================================================== -->
    <section class="hero" id="frame">
      <img class="aguila" src="assets/aguila.jpg" alt="" onerror="this.remove()" />
      <img class="foto" id="foto" alt="Último frame analizado por el dron" />
      <div class="sombra"></div>
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>

      <div class="palabra-fondo black" aria-hidden="true">EAGLE EYE</div>

      <div class="visor-ojo" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>

      <div class="hud">
        <span class="rec" id="hud-hora">--:--:--</span>
        <span><span id="hud-tipo"></span> · <span id="hud-ruta">—</span></span>
      </div>

      <div class="titular">
        <h2><span class="regular">Visión</span> <span class="black">aérea</span><br />
            <span class="amp">&amp;</span> <span class="black">análisis</span> <span class="regular">en vivo</span></h2>
        <p class="sub" id="txt-placeholder">Cero puntos ciegos</p>
      </div>

      <!-- (3) TARJETAS =======================================================
           Personas · % estrés (semáforo por severidad) · frames analizados · gasto.
           Severidad SOLO con la paleta: baja = azul, media = amarillo contorno, alta = amarillo sólido.
      ================================================================== -->
      <div class="tarjetas" id="tarjetas">
        <article class="vidrio tarjeta" id="t-personas">
          <span class="flecha">↗</span>
          <span class="etiqueta">Personas</span>
          <span class="numero black" id="t-personas-num">—</span>
          <span class="sev" id="t-personas-sev"></span>
        </article>
        <article class="vidrio tarjeta" id="t-estres">
          <span class="flecha">↗</span>
          <span class="etiqueta">Estrés del cultivo</span>
          <span class="numero black" id="t-estres-num">—</span>
          <span class="sev" id="t-estres-sev"></span>
        </article>
        <article class="vidrio tarjeta" id="t-frames">
          <span class="flecha">↗</span>
          <span class="etiqueta">Frames analizados</span>
          <span class="numero black" id="t-frames-num">—</span>
        </article>
        <article class="vidrio tarjeta gasto" id="t-gasto">
          <span class="flecha">↗</span>
          <span class="etiqueta">Gasto del agente</span>
          <span class="numero black" id="t-gasto-num">—</span>
          <span class="de" id="t-gasto-de"></span>
          <div class="barra" role="progressbar" aria-label="Gasto frente al presupuesto"
               aria-valuemin="0" aria-valuemax="100" id="t-gasto-barra"><span></span></div>
        </article>
      </div>
    </section>

    <!-- (4) FEED DE HALLAZGOS ================================================
         Lista de GET /hallazgos, los nuevos arriba: hora, tipo, severidad, descripción, recomendación.
    ===================================================================== -->
    <aside class="feed" id="feed">
      <div class="feed-titulo">
        <h2><span class="black">Hallazgos</span> <span class="contorno">en vivo</span></h2>
        <span class="etiqueta" id="txt-total"></span>
      </div>
      <ol class="lista" id="lista"></ol>
    </aside>

  </main>
  <script src="app.js"></script>
</body>
</html>
